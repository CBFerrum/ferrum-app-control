# The Control Plane's connector with ERP (Ferrum docs/plan/apps-ui.md §13): what needs both apps'
# records. A hosted workspace naming whom to bill is invoiced through ERP once a month, after the
# month, for its days in it at what it pays a month. Offered where both apps are installed; ships
# with the Control Plane.
id: control-erp
name: Control Plane and ERP
version: 0.2.0
publisher: cbferrum
summary: Hosted workspaces invoiced through ERP each month, for their days and their usage beyond what each pays for
categories: [connector, finance]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-control
support: https://github.com/CBFerrum/ferrum-app-control/issues
runtime: native
platform: ">=0.3.2, <0.4"
requires: {control: ">=0.4", erp: ">=0.1"}
packages: [control_erp]
uninstall: ask
