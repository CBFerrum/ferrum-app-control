[package]
name = "ferrum-app-control"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Ferrum Cloud's control plane, apart from the workspaces it runs: cells and their health, releases by digest, staged rollouts in maintenance windows, incidents and status, recovery requests, and the partners' portfolios"
repository = "https://github.com/CBFerrum/ferrum-app-control"
build = "build.rs"

[dependencies]
ferrum-kernel = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-meta = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-domain = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Its tests check that its interface is a release the platform takes, and its connector with ERP
# runs on ERP's records (customers, items, invoices).
ferrum-apps = { git = "https://github.com/CBFerrum/Ferrum", branch = "main" }
ferrum-app-erp = { git = "https://github.com/CBFerrum/ferrum-app-erp", branch = "main" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }

[lints.clippy]
# Deliberate patterns shared with the platform: sqlx row tuples.
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"
