id: control
name: Control Plane
version: 0.5.9
publisher: cbferrum
summary: "Ferrum Cloud's control plane: cells and their health, releases by digest, staged rollouts, incidents and status, recovery requests, and partners' portfolios"
description: README.md
categories: [developer]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-control
support: https://github.com/CBFerrum/ferrum-app-control/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [control]
uninstall: ask
# Its own interface at /control/: the cells, rollouts, incidents and workspaces; two pages of the
# portal, a partner's portfolio and a customer's service status; and the public status page.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: control
      route: control
      title: Control Plane
      description: Cells, releases, rollouts and incidents
      icon: server
      color: "#334155"
      roles: [Fleet Operator, Release Manager]
  shell.open:
    - {id: control, package: control, path: "control/e/{entity}/{id}", list: "control/e/{entity}"}
  shell.create:
    - {id: cell, label: Cell, path: control/e/Cell/new, entity: Cell}
    - {id: incident, label: Incident, path: control/e/ServiceIncident/new, entity: ServiceIncident}
  shell.portal:
    - {id: partner, title: Your customers, description: "Your customers' workspaces, their health and renewals, cases and statements"}
    - {id: service, title: Your service, description: "How your workspace is doing, coming maintenance and incidents"}
  # What anyone opens without signing in: /control/status/{workspace}, each region's cells, the
  # incidents told publicly and coming maintenance, from /api/site/{workspace}/control/status.
  shell.public:
    - {id: status, path: control/status, title: Service status}
  # What the assistant should know in Control Plane's pages, and what it suggests asking there.
  shell.assistant:
    - id: control
      title: "Control Plane"
      instructions: >-
        Ferrum Cloud's control plane. A Release is a Candidate until Qualified or Withdrawn. A Rollout takes it to
        cells in waves (RolloutWave: Pending, Upgrading, Soaking, Done, Failed) and is Halted when a wave fails. A
        ServiceIncident and its updates (Investigating, Identified, Monitoring, Resolved) are what the status page
        shows. A HostedWorkspace is a customer's workspace on a cell (Onboarding, Active, Closed). A RecoveryRequest
        is Requested, then Approved or Refused, then Done.
      suggestions:
        - "Which rollouts are running or halted?"
        - "Are there open incidents?"
        - "Which workspaces are still onboarding?"
